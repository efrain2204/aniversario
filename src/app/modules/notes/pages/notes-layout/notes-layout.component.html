<div class="travel-bg">
  <!-- Montañas decorativas -->
  <div class="mountain-bg mountain-1"></div>
  <div class="mountain-bg mountain-2"></div>
  <div class="mountain-bg mountain-3"></div>
  
  <!-- Nubes -->
  <div class="cloud-bg cloud-1"></div>
  <div class="cloud-bg cloud-2"></div>
  <div class="cloud-bg cloud-3"></div>
  
  <!-- Llama decorativa -->
  <div class="llama-bg">🦙</div>
</div>

<div class="notes-container">
  <!-- Título estilo pasaporte -->
  <div class="passport-header">
    <div class="passport-stamp">
      <span class="stamp-icon">🏔️</span>
    </div>
    <div class="title-section">
      <h1 class="travel-title">
        <span class="title-emoji">✈️</span>
        Diario de Viaje
        <span class="title-emoji">🗺️</span>
      </h1>
      <p class="travel-subtitle">Notas desde Cusco & Machu Picchu</p>
    </div>
    <div class="passport-stamp stamp-right">
      <span class="stamp-icon">🦙</span>
    </div>
  </div>

  <!-- Contenido principal -->
  <app-main></app-main>
  <app-footer></app-footer>
</div>

<!-- Botones flotantes -->
<button class="travel-btn back-btn" (click)="back()" title="Volver">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
  </svg>
</button>

<button class="travel-btn add-btn" (click)="openNewNote()" title="Nueva nota">
  <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
  </svg>
</button>

<!-- Modal nueva nota -->
<app-popup label="📝 Escribe tu nota de viaje!" *ngIf="newNoteModal" (clickClose)="clearModal()">
  <bunny-input placeHolder="Título de la nota..." [control]="titleNoteControl"></bunny-input>
  <text-area [control]="noteControl"></text-area>
  <app-button [disabled]="titleNoteControl.invalid || noteControl.invalid" *ngIf="newNoteModal.button1Text"
    [label]="newNoteModal.button1Text" (click)="newNoteModal.onButton1Click?.()"></app-button>
</app-popup>
